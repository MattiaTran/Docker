services:

  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: didattica-php:latest
    container_name: ${PROJECT_NAME}_web
    ports:
      - "${PORT_HTTP}:80"
      - "${PORT_HTTPS}:443"
    volumes:
      - ./www:/var/www/html
      - storage_data:/var/www/html/storage
    networks:
      - app_network
    depends_on:
      - database
    env_file:
      - .env

  database:
    image: mariadb:10.11
    container_name: ${PROJECT_NAME}_db
    restart: always
    ports:
      - "${PORT_DB}:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./db-init:/docker-entrypoint-initdb.d
    networks:
      - app_network
    env_file:
      - .env

  adminer:
    image: adminer:latest
    container_name: ${PROJECT_NAME}_adminer
    ports:
      - "${PORT_ADMINER}:8080"
    networks:
      - app_network
    depends_on:
      - database

networks:
  app_network:
    driver: bridge

volumes:
  db_data:
    driver: local
  storage_data:
    driver: local
